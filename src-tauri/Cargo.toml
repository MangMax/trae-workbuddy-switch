[package]
name = "buddy-switch-rust"
version = "2026.9.211636"
description = "BuddySwitch —— WorkBuddy 账号切换工具（Rust/Tauri 版）"
authors = ["NextAgentX"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buddy_switch_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 默认启用 custom-protocol：不开该 feature 的 `cargo build --release` 会产出加载
# devUrl http://localhost:1420 的开发模式 exe，vite 未运行时窗口即报
# “localhost 拒绝连接”。`tauri dev` 传 --no-default-features 并过滤本 feature，
# `tauri build` 显式传 tauri/custom-protocol，两者均不受影响。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# tauri-build → schemars 0.8.22（preserve_order）→ indexmap 1.9.3 同样存在
# E0107 问题；resolver v2 下 build-dependencies 的 features 与 normal
# dependencies 不合并，因此这里也要显式启用 std（见下方 normal 依赖处的注释）。
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# 显式依赖 indexmap 1.x 并强制启用 std feature（该版本无 default feature）：
# tauri 依赖链里的 schemars 0.8.22（preserve_order）按 `IndexMap<K, V>` 两泛型
# 参数使用它，该写法要求 `S` 参数有默认值，而默认值藏在 indexmap 的
# `#[cfg(has_std)]` 分支里。若依赖图中无人启用 std，其 build script 会在编译期
# 运行时探测 std 并可能失败，导致 schemars 编译报 E0107。启用 std 让 build
# script 走无需探测的稳定分支。
indexmap = { version = "1.9.3", features = ["std"] }
buddy-switch-core = { path = "../crates/buddy-switch-core" }
buddy-switch-gateway = { path = "../crates/buddy-switch-gateway" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.2"

# 系统自启（开机静默启动）：仅桌面目标支持（macOS / Windows / Linux）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
